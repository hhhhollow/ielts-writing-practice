<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />
  <title>雅思写作计时练习</title>
  <link rel="stylesheet" href="assets/styles.css" />

</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="timer-card" id="timerCard">
        <span class="timer-value" id="timerValue">00:00:00</span>
        <span id="timerState" hidden>准备开始</span>
        <div class="timer-actions">
          <button class="button timer-main" id="timerToggle" type="button">▶ 开始</button>
          <button class="button" id="timerReset" type="button" aria-label="重置计时">↺</button>
        </div>
      </div>
      <div class="editor-meta">
        <div class="editor-buttons">
          <button class="button button-ghost button-small" id="historyButton" type="button">记录</button>
          <button class="button button-ghost button-small" id="backupButton" type="button">备份</button>
          <button class="button button-ghost button-small" id="newPracticeButton" type="button">新建</button>
          <button class="button button-primary button-small" id="saveButton" type="button">保存</button>
          <button class="button button-ghost button-small" id="spellcheckButton" type="button" aria-pressed="false">拼写：关</button>
          <button class="button button-ghost button-small" id="highlightButton" type="button" title="选中文字后点击；再次点击取消" aria-label="给选中文字添加或取消荧光">荧光</button>
          <button class="button button-ghost button-small" id="printButton" type="button">打印</button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <aside class="card prompt-card" id="promptCard">
        <div class="task-tabs" role="group" aria-label="题型选择">
          <button class="task-tab" data-task="task1" type="button" aria-pressed="false">Task 1 · Report</button>
          <button class="task-tab active" data-task="task2" type="button" aria-pressed="true">Task 2 · Essay</button>
        </div>

        <div class="question-controls">
          <div class="prompt-select">
            <select id="questionSetSelect" aria-label="选择剑桥雅思真题"></select>
          </div>
          <div class="question-title-wrap">
            <input class="title-input" id="titleInput" type="text" maxlength="120" placeholder="题目标题" aria-label="题目标题" />
          </div>
        </div>

        <div class="prompt-box">
          <textarea class="question-area" id="promptText" lang="en" spellcheck="false" autocorrect="off" autocomplete="off" autocapitalize="off" writingsuggestions="false" aria-label="可编辑题目"></textarea>
        </div>
        <div class="task-image-panel" id="taskImagePanel" hidden>
          <div class="image-dropzone" id="imageDropzone" tabindex="0" aria-label="粘贴或拖入 Task 1 题目图片">
            <div class="image-empty" id="imageEmpty"><strong>点击这里后粘贴图片</strong><span>Ctrl / Command + V</span></div>
            <img class="prompt-image" id="promptImage" alt="Task 1 题目图片" draggable="false" hidden />
          </div>
          <input id="promptImageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
          <div class="image-actions" id="imageActions">
            <button class="button button-ghost button-small" id="replaceImageButton" type="button">选择图片</button>
            <button class="button button-ghost button-small" id="removeImageButton" type="button" hidden>移除</button>
          </div>
        </div>
      </aside>

      <section class="editor-column">
        <div class="card editor-card">
          <div class="editor-body">
            <div class="editor-hint">
              <span>建议目标：<strong id="targetHint">至少 250 词</strong></span>
              <span class="no-correction">不含自动纠错</span>
            </div>
            <div class="writing-highlights" id="writingHighlights" aria-hidden="true"></div>
            <textarea class="writing-area" id="writingArea" lang="en" spellcheck="false" autocorrect="off" autocomplete="off" autocapitalize="off" writingsuggestions="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" aria-label="作文写作区"></textarea>
          </div>
          <div class="editor-footer">
            <div class="stats">
              <div class="stat"><span class="stat-value" id="wordCount">0</span><span class="stat-label">words</span></div>
              <div class="stat target"><span class="stat-value" id="targetCount">250</span><span class="stat-label">target</span></div>
              <div class="stat"><span class="stat-value" id="charCount">0</span><span class="stat-label">characters</span></div>
              <div class="progress" aria-label="目标完成度"><div class="progress-bar" id="progressBar"></div></div>
            </div>
            <span class="stat-label" id="paragraphCount">0 paragraphs</span>
          </div>
        </div>

      </section>
    </main>
  </div>

  <article class="print-sheet" id="printSheet">
    <header class="print-header">
      <p class="print-task" id="printTask">IELTS Writing Task 2</p>
      <h1 id="printTitle">Untitled practice</h1>
      <p class="print-meta" id="printMeta"></p>
    </header>
    <section class="print-section print-question-section">
      <h2>Question</h2>
      <div class="print-text" id="printQuestion"></div>
      <img class="print-question-image" id="printQuestionImage" alt="Task 1 question" hidden />
    </section>
    <div class="print-writing-grid">
      <section class="print-section print-answer-section">
        <h2>Answer</h2>
        <div class="print-text print-answer" id="printAnswer"></div>
      </section>
      <aside class="print-notes" aria-label="Notes">
        <h2>Notes</h2>
        <div class="print-note-lines"></div>
      </aside>
    </div>
  </article>

  <div class="modal-backdrop" id="historyModal" hidden>
    <section class="history-modal" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
      <div class="modal-heading">
        <h2 id="historyTitle">历史练习</h2>
        <button class="close-button" id="closeHistoryButton" type="button" aria-label="关闭">×</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="data/question-bank.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
